set-option -sa terminal-features ',alacritty:RGB'
set -g mouse on
set -g default-terminal "screen-256color"

# Send prefix to the remote host
bind-key b send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Ayu theme config
set -g @ayu_widgets "#(date +%s)"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin "nordtheme/tmux"
# Test
set -g @plugin 'JanSuthacheeva/tmux-agent-status'
set -g @agent_status_default 'off'
# agent status second statusline row set AFTER tpm run (below) so nordtheme can't clobber it

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-option -g status-interval 1
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"
run '~/.tmux/plugins/tpm/tpm'

# Append window count to session name in top bar (after tpm so nord theme is already applied)
set -g status-left-length 40
set -g status-left "#[fg=black,bg=blue,bold] #S (#{session_windows}) #[fg=blue,bg=black,nobold,noitalics,nounderscore]"

# Second statusline row for agent status (after tpm so theme is already applied)
set -g status 2
set -g 'status-format[1]' '#[align=left]#[fg=black,bg=blue,bold] Agents #[fg=blue,bg=black,nobold,noitalics,nounderscore]#[fg=white,bg=black] #(~/.tmux/plugins/tmux-agent-status/scripts/agent-summary)'
